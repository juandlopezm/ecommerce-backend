name: CI Backend

# Se ejecuta en cada push a cualquier rama y en los Pull Requests hacia develop/main.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    name: Lint + tipos + pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Formato (black)
        run: black --check .

      - name: Tipos (mypy)
        run: mypy app

      - name: Pruebas + cobertura (pytest)
        run: pytest
