name: CI Backend

# Se ejecuta en cada push a cualquier rama y en los Pull Requests hacia develop/main.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    name: Lint + tipos + pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Formato (black)
        run: black --check .

      - name: Tipos (mypy)
        run: mypy app

      - name: Pruebas + cobertura (pytest, SQLite)
        run: pytest

  integration-postgres:
    name: Integración con PostgreSQL
    runs-on: ubuntu-latest

    # Levanta un PostgreSQL real como servicio para las pruebas de integración con BD.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # La suite usa esta BD real en lugar de SQLite (ver tests/conftest.py).
      TEST_DATABASE_URL: postgresql+psycopg://ecommerce:ecommerce@localhost:5432/ecommerce_test

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias (con driver de PostgreSQL)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      - name: Validar migraciones en PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://ecommerce:ecommerce@localhost:5432/ecommerce_test
        run: alembic upgrade head

      - name: Pruebas de integración contra PostgreSQL
        run: pytest
