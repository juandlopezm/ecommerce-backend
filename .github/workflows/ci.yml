name: CI Backend

# Estrategia por capas:
#  - lint + sast + unitarias  → en CADA push (feedback rápido).
#  - integración + gate ≥70 % → solo en PR/push a develop/main.
#  - sonarcloud               → tras integración + bandit exitosos.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # py-cov-action guarda badge en rama de datos
  pull-requests: write   # comentario de cobertura en el PR
  checks: write          # dorny/test-reporter publica el check

jobs:
  # ─── 1. Lint y tipos ─────────────────────────────────────────────────────────
  lint:
    name: Lint y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Formato (black)
        run: black --check .
      - name: Tipos (mypy)
        run: mypy app

  # ─── 2. SAST – Bandit ────────────────────────────────────────────────────────
  sast:
    name: SAST – Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Analizar con Bandit (JSON → SonarCloud)
        run: |
          mkdir -p reports
          bandit -r app -f json -o reports/bandit.json || true
      - name: Mostrar resumen Bandit en log
        run: bandit -r app || true
      - name: Subir reporte Bandit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: reports/bandit.json
          retention-days: 30

  # ─── 3. Pruebas unitarias ─────────────────────────────────────────────────────
  unit:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unitarias + cobertura parcial
        run: |
          mkdir -p reports
          pytest tests/unit \
            --cov=app \
            --cov-report=xml:reports/coverage-unit.xml \
            --cov-report=html:reports/htmlcov-unit \
            --junitxml=reports/junit-unit.xml \
            -q
      - name: Publicar resultados (unitarias)
        uses: dorny/test-reporter@v1
        if: always()
        continue-on-error: true
        with:
          name: Resultados unitarias
          path: reports/junit-unit.xml
          reporter: java-junit
      - name: Subir reportes unitarias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-unit
          path: reports/
          retention-days: 7

  # ─── 4. Integración y cobertura ──────────────────────────────────────────────
  integration:
    name: Integración y cobertura (≥70 %)
    runs-on: ubuntu-latest
    # Solo al ir a producción: PR a develop|main, o push directo a develop|main.
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/develop' ||
      github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ecommerce:ecommerce@localhost:5432/ecommerce_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"
      - name: Validar migraciones en PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://ecommerce:ecommerce@localhost:5432/ecommerce_test
        run: alembic upgrade head
      - name: Suite completa + gate de cobertura (≥70 %)
        run: |
          mkdir -p reports
          pytest \
            --cov=app \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov \
            --cov-fail-under=70 \
            --junitxml=reports/junit-all.xml \
            -q
      - name: Publicar resultados (integración)
        uses: dorny/test-reporter@v1
        if: always()
        continue-on-error: true
        with:
          name: Resultados integración
          path: reports/junit-all.xml
          reporter: java-junit
      - name: Comentario de cobertura en PR
        uses: py-cov-action/python-coverage-comment-action@v3
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Subir a Codecov
        uses: codecov/codecov-action@v4
        if: always()
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: reports/coverage.xml
      - name: Subir reportes integración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-integracion
          path: reports/
          retention-days: 7

  # ─── 5. SonarCloud ────────────────────────────────────────────────────────────
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [sast, integration]
    # Solo si integración pasó (lo que garantiza que hay reportes frescos).
    if: >-
      always() &&
      needs.integration.result == 'success' &&
      (needs.sast.result == 'success' || needs.sast.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SCM info completo para blame + new-code period
      - name: Descargar reporte Bandit
        uses: actions/download-artifact@v4
        with:
          name: bandit-report
          path: reports/
        continue-on-error: true
      - name: Descargar reportes de integración
        uses: actions/download-artifact@v4
        with:
          name: reportes-integracion
          path: reports/
        continue-on-error: true
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
