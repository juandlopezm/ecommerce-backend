name: Pipeline Backend

# ─────────────────────────────────────────────────────────────────────────────
# Pipeline progresivo por AMBIENTES con reutilización de resultados por SHA.
#
# El job `precheck` decide el ambiente (flow) y si se pueden REUTILIZAR las
# pruebas que ya pasaron para este mismo commit (SHA):
#
#   flow=dev      → push a feature/**, develop
#                   Cadena SECUENCIAL: lint → unit → integración → SAST(Bandit)
#                   → SonarCloud. El gate es que las pruebas pasen (sin gate de
#                   cobertura). Sube artefactos por SHA.
#   flow=staging  → pull_request a develop/main
#                   REUTILIZA unit+integración del push del mismo SHA (no las
#                   repite) + DAST(ZAP) + rendimiento(Locust) sobre preprod.
#   flow=prod     → push a main
#                   Reutiliza lo previo (si existe) + publica imagen GHCR + smoke.
#
# El dashboard es ACUMULATIVO: cada ambiente arrastra los artefactos del SHA del
# ambiente anterior, así se integran todas las pruebas en un único informe.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: pipeline-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # leer/descargar artefactos de corridas previas (reutilización por SHA)
  checks: write
  pull-requests: write
  packages: write
  pages: write
  id-token: write

jobs:
  # ═══ 0. Arranque: decidir ambiente y si se reutiliza por SHA ══════════════════
  precheck:
    name: Ambiente y reutilización
    runs-on: ubuntu-latest
    outputs:
      flow: ${{ steps.r.outputs.flow }}
      reuse: ${{ steps.r.outputs.reuse }}
      run_id: ${{ steps.r.outputs.run_id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: r
        shell: bash
        run: |
          REPO="${{ github.repository }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            FLOW=staging
            SHA="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            FLOW=prod
            SHA="${{ github.sha }}"
          else
            FLOW=dev
            SHA="${{ github.sha }}"
          fi
          echo "flow=$FLOW" >> "$GITHUB_OUTPUT"

          REUSE=false
          RUN_ID=""
          if [[ "$FLOW" != "dev" ]]; then
            echo "Buscando corrida push exitosa para SHA $SHA ..."
            RID=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&event=push&status=completed&per_page=30" \
                  --jq 'first(.workflow_runs[] | select(.conclusion=="success" and .name=="Pipeline Backend") | .id) // empty' || echo "")
            if [[ -n "$RID" ]]; then
              CNT=$(gh api "repos/$REPO/actions/runs/$RID/artifacts" \
                    --jq '[.artifacts[] | select(.name=="unit-results" and .expired==false)] | length' || echo "0")
              if [[ "${CNT:-0}" -gt 0 ]]; then REUSE=true; RUN_ID="$RID"; fi
            fi
          fi
          echo "reuse=$REUSE" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Ambiente=$FLOW · reutilizar=$REUSE · run_id=$RUN_ID"

  # ═══ 1. DEV · Lint y tipos ════════════════════════════════════════════════════
  lint:
    name: Lint y tipos
    needs: precheck
    if: ${{ needs.precheck.outputs.flow == 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: mypy app

  # ═══ 2. DEV · Pruebas unitarias (fakes en memoria) ════════════════════════════
  unit:
    name: Pruebas unitarias
    needs: [precheck, lint]
    # Corre en dev, o en staging SOLO si no hay resultados reutilizables (fallback).
    if: ${{ !cancelled() && (needs.precheck.outputs.flow == 'dev' || (needs.precheck.outputs.flow == 'staging' && needs.precheck.outputs.reuse == 'false')) && (needs.lint.result == 'success' || needs.lint.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      COVERAGE_FILE: .coverage.unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest (unit)
        run: |
          mkdir -p reports
          pytest tests/unit -o junit_suite_name=unitarias \
            --cov=app --cov-report=xml:reports/coverage-unit.xml \
            --junitxml=reports/junit-unit.xml -q
      - uses: dorny/test-reporter@v1
        if: always()
        continue-on-error: true
        with:
          name: Resultados unitarias
          path: reports/junit-unit.xml
          reporter: java-junit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: |
            reports/junit-unit.xml
            reports/coverage-unit.xml
            .coverage.unit
          include-hidden-files: true
          retention-days: 7

  # ═══ 3. DEV · Pruebas de integración (SQLite en memoria) ══════════════════════
  integration:
    name: Pruebas de integración
    needs: [precheck, unit]
    if: ${{ !cancelled() && (needs.precheck.outputs.flow == 'dev' || (needs.precheck.outputs.flow == 'staging' && needs.precheck.outputs.reuse == 'false')) && needs.unit.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      COVERAGE_FILE: .coverage.int
      # Sin TEST_DATABASE_URL → conftest usa SQLite en memoria (mock de BD).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest (integration)
        run: |
          mkdir -p reports
          pytest tests/integration -o junit_suite_name=integracion \
            --cov=app --cov-report=xml:reports/coverage-int.xml \
            --junitxml=reports/junit-integration.xml -q
      - uses: dorny/test-reporter@v1
        if: always()
        continue-on-error: true
        with:
          name: Resultados integración
          path: reports/junit-integration.xml
          reporter: java-junit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: |
            reports/junit-integration.xml
            reports/coverage-int.xml
            .coverage.int
          include-hidden-files: true
          retention-days: 7

  # ═══ 4. DEV · Seguridad estática (Bandit) ═════════════════════════════════════
  static_security:
    name: Seguridad estática (Bandit)
    needs: [precheck, integration]
    if: ${{ !cancelled() && needs.precheck.outputs.flow == 'dev' && needs.integration.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Analizar con Bandit
        run: |
          mkdir -p reports
          bandit -r app -f json -o reports/bandit.json || true
          bandit -r app || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: reports/bandit.json
          retention-days: 7

  # ═══ 5. DEV · SonarCloud (cobertura combinada, SIN gate) ══════════════════════
  sonarqube:
    name: SonarCloud
    needs: [precheck, unit, integration, static_security]
    if: ${{ !cancelled() && needs.precheck.outputs.flow == 'dev' && needs.static_security.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install coverage
      - uses: actions/download-artifact@v4
        with:
          name: unit-results
          path: art-unit
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: integration-results
          path: art-int
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: bandit-report
          path: reports
        continue-on-error: true
      - name: Combinar cobertura (informativa, sin gate) + ubicar junit
        run: |
          mkdir -p reports
          cp art-unit/reports/junit-unit.xml reports/ 2>/dev/null || true
          cp art-int/reports/junit-integration.xml reports/ 2>/dev/null || true
          cp art-unit/.coverage.unit . 2>/dev/null || true
          cp art-int/.coverage.int . 2>/dev/null || true
          # relative_files=true (pyproject) permite combinar datos de jobs distintos.
          coverage combine .coverage.unit .coverage.int || true
          coverage xml -o reports/coverage.xml || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: reports/coverage.xml
          retention-days: 7
      - uses: SonarSource/sonarqube-scan-action@v4
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ═══ 6. STAGING/PROD · Reutilizar artefactos del SHA (acumulativo) ════════════
  reuse_artifacts:
    name: Reutilizar pruebas del SHA
    needs: precheck
    if: ${{ (needs.precheck.outputs.flow == 'staging' || needs.precheck.outputs.flow == 'prod') && needs.precheck.outputs.reuse == 'true' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Descargar artefactos de la corrida previa (mismo SHA)
        run: |
          mkdir -p reused
          gh run download "${{ needs.precheck.outputs.run_id }}" \
            -R "${{ github.repository }}" -D reused || true
          echo "Artefactos reutilizados:"; ls -R reused || true
      - uses: actions/upload-artifact@v4
        with:
          name: reused-artifacts
          path: reused
          retention-days: 7

  # ═══ 7. STAGING · DAST (OWASP ZAP) ════════════════════════════════════════════
  cd_dast:
    name: DAST (OWASP ZAP)
    needs: [precheck, reuse_artifacts, integration]
    if: ${{ !cancelled() && needs.precheck.outputs.flow == 'staging' && (needs.reuse_artifacts.result == 'success' || needs.integration.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Levantar preprod (compose + migrar + sembrar + /health)
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do docker compose exec -T db pg_isready -U ecommerce >/dev/null 2>&1 && break; sleep 2; done
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api python -m app.seed || echo "seed admin opcional"
          docker compose exec -T api python -m app.seed_products
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health >/dev/null && break; sleep 2; done
          curl -sf http://localhost:8000/health
      # El contenedor ZAP alcanza el host por el gateway del bridge (172.17.0.1).
      - name: OWASP ZAP (DAST)
        uses: zaproxy/action-baseline@master
        with:
          target: http://172.17.0.1:8000
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false
          token: ${{ secrets.GITHUB_TOKEN }}
          cmd_options: "-a"
      - name: Apagar preprod
        if: always()
        run: docker compose down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cd-dast
          path: |
            report_json.json
            report_html.html
            report_md.md
          retention-days: 7

  # ═══ 8. STAGING · Rendimiento (Locust con múltiples escenarios + gate p95) ═════
  cd_perf:
    name: Rendimiento (Locust)
    needs: [precheck, reuse_artifacts, integration]
    if: ${{ !cancelled() && needs.precheck.outputs.flow == 'staging' && (needs.reuse_artifacts.result == 'success' || needs.integration.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      PERF_MAX_P95_MS: "1500"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Levantar preprod (compose + migrar + sembrar + /health)
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do docker compose exec -T db pg_isready -U ecommerce >/dev/null 2>&1 && break; sleep 2; done
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api python -m app.seed || echo "seed admin opcional"
          docker compose exec -T api python -m app.seed_products
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health >/dev/null && break; sleep 2; done
          curl -sf http://localhost:8000/health
      
      - name: Instalar Locust
        run: |
          pip install -e ".[perf]"
          mkdir -p reports
      
      - name: "Prueba 1: Rendimiento estándar (100 visitantes)"
        continue-on-error: true
        run: |
          locust -f perf/locustfile.py VisitanteTienda --headless -u 100 -r 20 --run-time 60s \
            --host http://localhost:8000 --csv reports/locust-standard --html reports/locust-standard.html || true
      
      - name: "Prueba 2: Checkout bajo carga (20 compradores)"
        continue-on-error: true
        run: |
          locust -f perf/locustfile.py Comprador --headless -u 20 -r 5 --run-time 60s \
            --host http://localhost:8000 --csv reports/locust-checkout --html reports/locust-checkout.html || true
      
      - name: "Prueba 3: Admin CRUD (15 administradores)"
        continue-on-error: true
        run: |
          locust -f perf/locustfile.py UsuarioAutenticado --headless -u 15 -r 3 --run-time 60s \
            --host http://localhost:8000 --csv reports/locust-admin --html reports/locust-admin.html || true
      
      - name: "Prueba 4: Estrés combinado (200 usuarios mixtos)"
        continue-on-error: true
        run: |
          locust -f perf/locustfile.py --headless -u 200 -r 40 --run-time 90s \
            --host http://localhost:8000 --csv reports/locust-stress --html reports/locust-stress.html || true
      
      - name: Validar gate P95 (prueba estándar)
        run: |
          python - <<'PY'
          import csv, os, sys
          p95 = None
          with open("reports/locust-standard_stats.csv") as fh:
              for row in csv.DictReader(fh):
                  if row.get("Name", "").strip() == "Aggregated":
                      for k in ("95%", "95%ile"):
                          if row.get(k):
                              p95 = float(row[k]); break
          limit = float(os.environ["PERF_MAX_P95_MS"])
          print(f"\n✓ P95 mediana (standard): {p95} ms (límite {limit} ms)")
          if p95 is None:
              sys.exit("No se pudo leer el p95 de Locust")
          sys.exit(0 if p95 <= limit else f"P95 {p95} ms supera el límite {limit} ms")
          PY
      
      - name: Generar resumen HTML de todas las pruebas
        if: always()
        continue-on-error: true
        run: |
          python perf/generate_report.py reports reports/index.html
          echo "✓ Reportes HTML disponibles en reports/"
      
      - name: Apagar preprod
        if: always()
        run: docker compose down -v
      
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cd-perf
          path: reports/
          retention-days: 7

  # ═══ 9. PROD · Publicar imagen GHCR ═══════════════════════════════════════════
  publish_image:
    name: Publicar imagen (GHCR)
    needs: precheck
    if: ${{ needs.precheck.outputs.flow == 'prod' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  # ═══ 10. PROD · Smoke test contra producción ══════════════════════════════════
  deploy_smoke:
    name: Smoke test (producción)
    needs: [precheck, publish_image]
    if: ${{ !cancelled() && needs.precheck.outputs.flow == 'prod' && needs.publish_image.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Health check (Render)
        run: |
          URL="https://ecommerce-backend-8ckl.onrender.com/health"
          for i in $(seq 1 30); do
            if curl -sf "$URL" >/dev/null; then echo "✅ Producción saludable"; exit 0; fi
            echo "esperando despliegue... ($i)"; sleep 10
          done
          echo "❌ El backend de producción no respondió"; exit 1

  # ═══ 11. Dashboard acumulativo (siempre) ══════════════════════════════════════
  dashboard:
    name: Dashboard de resultados
    needs:
      [
        precheck,
        lint,
        unit,
        integration,
        static_security,
        sonarqube,
        reuse_artifacts,
        cd_dast,
        cd_perf,
        publish_image,
        deploy_smoke,
      ]
    if: ${{ always() && needs.precheck.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: dashboard-artifacts
        continue-on-error: true
      - name: Construir dashboard
        env:
          PIPELINE_FLOW: ${{ needs.precheck.outputs.flow }}
        run: |
          mkdir -p dashboard
          python ci/build_dashboard.py \
            --input dashboard-artifacts \
            --html-out dashboard/index.html \
            --md-out dashboard/summary.md
          cat dashboard/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-html
          path: dashboard
          retention-days: 30
      - name: Preparar artefacto de Pages
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  # ═══ 12. Publicar dashboard en GitHub Pages (best-effort) ═════════════════════
  publish_pages:
    name: Publicar dashboard (Pages)
    needs: [precheck, dashboard]
    if: ${{ always() && needs.dashboard.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
