name: Pipeline Backend

# ─────────────────────────────────────────────────────────────────────────────
# Pipeline ÚNICO (reemplaza a ci.yml + security.yml + docker-publish.yml).
#
# El job `route` decide el FLUJO según la rama destino y el resto de jobs se
# activan con `if: needs.route.outputs.flow == '...'`. Cada prueba corre en UN
# solo flujo (sin redundancia):
#
#   flow=ci      → feature/**, develop, PR→develop
#                  lint · SAST(Bandit) · unit · integración(SQLite memoria)
#                  · cobertura(≥70%) · SonarCloud
#   flow=cd      → release/**, PR→main
#                  preprod en Docker + Karate(caja negra) · ZAP(DAST) · Locust(perf)
#                  con gates ESTRICTOS
#   flow=deploy  → push a main
#                  publica imagen GHCR + smoke test (las pesadas ya pasaron en release/**)
#
# Al final, el job `dashboard` agrega TODOS los resultados (Step Summary + HTML
# + GitHub Pages).
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: pipeline-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # dorny/test-reporter publica el check
  pull-requests: write # comentarios en PR
  packages: write # publicar imagen en GHCR
  pages: write # desplegar dashboard en Pages
  id-token: write # OIDC para deploy-pages

jobs:
  # ═══ 0. Arranque común: decidir el flujo ════════════════════════════════════
  route:
    name: Determinar flujo
    runs-on: ubuntu-latest
    outputs:
      flow: ${{ steps.r.outputs.flow }}
    steps:
      - id: r
        shell: bash
        run: |
          REF="${{ github.ref }}"
          BASE="${{ github.base_ref }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ "$BASE" == "main" ]]; then FLOW=cd; else FLOW=ci; fi
          elif [[ "$REF" == "refs/heads/main" ]]; then
            FLOW=deploy
          elif [[ "$REF" == refs/heads/release/* ]]; then
            FLOW=cd
          else
            FLOW=ci
          fi
          echo "flow=$FLOW" >> "$GITHUB_OUTPUT"
          echo "Flujo seleccionado: $FLOW"

  # ═══ 1. CI · Lint y tipos ════════════════════════════════════════════════════
  lint:
    name: Lint y tipos
    needs: route
    if: needs.route.outputs.flow == 'ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: mypy app

  # ═══ 2. CI · SAST (Bandit) ═══════════════════════════════════════════════════
  sast:
    name: SAST (Bandit)
    needs: route
    if: needs.route.outputs.flow == 'ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Analizar con Bandit
        run: |
          mkdir -p reports
          bandit -r app -f json -o reports/bandit.json || true
          bandit -r app || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: reports/bandit.json
          retention-days: 7

  # ═══ 3. CI · Pruebas unitarias (fakes en memoria) ════════════════════════════
  unit:
    name: Pruebas unitarias
    needs: route
    if: needs.route.outputs.flow == 'ci'
    runs-on: ubuntu-latest
    env:
      COVERAGE_FILE: .coverage.unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest (unit)
        run: |
          mkdir -p reports
          pytest tests/unit --cov=app --junitxml=reports/junit-unit.xml -q
      - uses: dorny/test-reporter@v1
        if: always()
        continue-on-error: true
        with:
          name: Resultados unitarias
          path: reports/junit-unit.xml
          reporter: java-junit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: |
            reports/junit-unit.xml
            .coverage.unit
          include-hidden-files: true
          retention-days: 7

  # ═══ 4. CI · Pruebas de integración (SQLite en memoria = "H2") ════════════════
  integration:
    name: Integración (SQLite memoria)
    needs: route
    if: needs.route.outputs.flow == 'ci'
    runs-on: ubuntu-latest
    env:
      COVERAGE_FILE: .coverage.int
      # Sin TEST_DATABASE_URL → conftest.py usa SQLite en memoria (mock de BD para CI).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest (integration)
        run: |
          mkdir -p reports
          pytest tests/integration --cov=app --junitxml=reports/junit-integration.xml -q
      - uses: dorny/test-reporter@v1
        if: always()
        continue-on-error: true
        with:
          name: Resultados integración
          path: reports/junit-integration.xml
          reporter: java-junit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: |
            reports/junit-integration.xml
            .coverage.int
          include-hidden-files: true
          retention-days: 7

  # ═══ 5. CI · Cobertura combinada (gate ≥70%) ═════════════════════════════════
  coverage:
    name: Cobertura combinada (≥70%)
    needs: [route, unit, integration]
    if: needs.route.outputs.flow == 'ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: unit-results
          path: cov-unit
      - uses: actions/download-artifact@v4
        with:
          name: integration-results
          path: cov-int
      - name: Combinar cobertura y exigir gate
        run: |
          mkdir -p reports
          cp cov-unit/.coverage.unit . 2>/dev/null || true
          cp cov-int/.coverage.int . 2>/dev/null || true
          # relative_files=true (pyproject) permite combinar datos de jobs distintos.
          coverage combine .coverage.unit .coverage.int
          coverage xml -o reports/coverage.xml
          coverage html -d reports/htmlcov
          coverage report --fail-under=70
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: reports/
          retention-days: 7
      - uses: codecov/codecov-action@v4
        if: always()
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: reports/coverage.xml

  # ═══ 6. CI · SonarCloud ══════════════════════════════════════════════════════
  sonarcloud:
    name: SonarCloud
    needs: [route, coverage, sast]
    if: needs.route.outputs.flow == 'ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: reports
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: bandit-report
          path: reports
        continue-on-error: true
      - uses: SonarSource/sonarcloud-github-action@master
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}

  # ═══ 7a. CD · Caja negra de API (Schemathesis desde OpenAPI) ═════════════════
  cd-api-blackbox:
    name: Caja negra API (Schemathesis)
    needs: route
    if: needs.route.outputs.flow == 'cd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Levantar preprod (compose + migrar + sembrar + /health)
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do docker compose exec -T db pg_isready -U ecommerce >/dev/null 2>&1 && break; sleep 2; done
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api python -m app.seed || echo "seed admin opcional"
          docker compose exec -T api python -m app.seed_products
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health >/dev/null && break; sleep 2; done
          curl -sf http://localhost:8000/health
      - name: Schemathesis (genera casos desde /openapi.json)
        run: |
          pip install "schemathesis>=3.19,<4"
          mkdir -p reports
          # Check por defecto (not_a_server_error): falla solo ante 5xx (crash real).
          # Los 4xx por fuzzing (422/429) NO rompen el build.
          schemathesis run http://localhost:8000/openapi.json \
            --hypothesis-max-examples=20 \
            --junit-xml=reports/junit-schemathesis.xml
      - name: Apagar preprod
        if: always()
        run: docker compose down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cd-apitest
          path: reports/
          retention-days: 7

  # ═══ 7b. CD · DAST (OWASP ZAP baseline) ══════════════════════════════════════
  cd-dast:
    name: DAST (OWASP ZAP)
    needs: route
    if: needs.route.outputs.flow == 'cd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Levantar preprod (compose + migrar + sembrar + /health)
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do docker compose exec -T db pg_isready -U ecommerce >/dev/null 2>&1 && break; sleep 2; done
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api python -m app.seed || echo "seed admin opcional"
          docker compose exec -T api python -m app.seed_products
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health >/dev/null && break; sleep 2; done
          curl -sf http://localhost:8000/health
      # El contenedor ZAP alcanza el host por el gateway del bridge (172.17.0.1).
      - name: OWASP ZAP (DAST)
        uses: zaproxy/action-baseline@master
        with:
          target: http://172.17.0.1:8000
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false
          token: ${{ secrets.GITHUB_TOKEN }}
          cmd_options: "-a"
      - name: Apagar preprod
        if: always()
        run: docker compose down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cd-dast
          path: |
            report_json.json
            report_html.html
            report_md.md
          retention-days: 7

  # ═══ 7c. CD · Rendimiento (Locust headless, gate p95) ════════════════════════
  cd-perf:
    name: Rendimiento (Locust)
    needs: route
    if: needs.route.outputs.flow == 'cd'
    runs-on: ubuntu-latest
    env:
      PERF_MAX_P95_MS: "1500" # umbral tunable (hallazgo previo ~2.3s a 100 usuarios)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Levantar preprod (compose + migrar + sembrar + /health)
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do docker compose exec -T db pg_isready -U ecommerce >/dev/null 2>&1 && break; sleep 2; done
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api python -m app.seed || echo "seed admin opcional"
          docker compose exec -T api python -m app.seed_products
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health >/dev/null && break; sleep 2; done
          curl -sf http://localhost:8000/health
      - name: Locust (headless) + gate p95
        run: |
          pip install -e ".[perf]"
          mkdir -p reports
          locust -f perf/locustfile.py --headless -u 100 -r 20 --run-time 60s \
            --host http://localhost:8000 --csv reports/locust --html reports/locust.html
          python - <<'PY'
          import csv, os, sys
          p95 = None
          with open("reports/locust_stats.csv") as fh:
              for row in csv.DictReader(fh):
                  if row.get("Name", "").strip() == "Aggregated":
                      for k in ("95%", "95%ile"):
                          if row.get(k):
                              p95 = float(row[k]); break
          limit = float(os.environ["PERF_MAX_P95_MS"])
          print(f"p95={p95} ms (límite {limit} ms)")
          if p95 is None:
              sys.exit("No se pudo leer el p95 de Locust")
          sys.exit(0 if p95 <= limit else f"p95 {p95} ms supera el límite {limit} ms")
          PY
      - name: Apagar preprod
        if: always()
        run: docker compose down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cd-perf
          path: reports/
          retention-days: 7

  # ═══ 8. DEPLOY · Publicar imagen GHCR ════════════════════════════════════════
  publish-image:
    name: Publicar imagen (GHCR)
    needs: route
    if: needs.route.outputs.flow == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  # ═══ 9. DEPLOY · Smoke test contra producción ════════════════════════════════
  deploy-smoke:
    name: Smoke test (producción)
    needs: [route, publish-image]
    if: needs.route.outputs.flow == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Health check (Render)
        run: |
          URL="https://ecommerce-backend-8ckl.onrender.com/health"
          for i in $(seq 1 30); do
            if curl -sf "$URL" >/dev/null; then echo "✅ Producción saludable"; exit 0; fi
            echo "esperando despliegue... ($i)"; sleep 10
          done
          echo "❌ El backend de producción no respondió"; exit 1

  # ═══ 10. Dashboard agregado (siempre) ════════════════════════════════════════
  dashboard:
    name: Dashboard de resultados
    needs:
      [
        route,
        lint,
        sast,
        unit,
        integration,
        coverage,
        sonarcloud,
        cd-api-blackbox,
        cd-dast,
        cd-perf,
        publish-image,
        deploy-smoke,
      ]
    if: ${{ always() && needs.route.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: dashboard-artifacts
        continue-on-error: true
      - name: Construir dashboard
        env:
          PIPELINE_FLOW: ${{ needs.route.outputs.flow }}
        run: |
          mkdir -p dashboard
          python ci/build_dashboard.py \
            --input dashboard-artifacts \
            --html-out dashboard/index.html \
            --md-out dashboard/summary.md
          cat dashboard/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-html
          path: dashboard
          retention-days: 30
      - name: Preparar artefacto de Pages
        if: needs.route.outputs.flow == 'cd' || needs.route.outputs.flow == 'deploy'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  # ═══ 11. Publicar dashboard en GitHub Pages (best-effort) ════════════════════
  publish-pages:
    name: Publicar dashboard (Pages)
    needs: [route, dashboard]
    if: ${{ always() && (needs.route.outputs.flow == 'cd' || needs.route.outputs.flow == 'deploy') }}
    runs-on: ubuntu-latest
    # NOTA: en repos privados con plan free, Pages puede fallar (403). Por eso el
    # paso es best-effort; el HTML siempre queda disponible como artefacto.
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
