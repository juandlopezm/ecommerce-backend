name: Seguridad - OWASP ZAP

on:
  workflow_dispatch:
    inputs:
      target:
        description: "URL base a escanear"
        default: "https://ecommerce-backend-8ckl.onrender.com"
  schedule:
    - cron: "0 6 * * 1" # lunes 06:00 UTC

permissions:
  contents: read
  issues: write # ZAP crea/actualiza un issue con los hallazgos

jobs:
  zap-baseline:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Despertar el backend (Render free se duerme)
        run: |
          TARGET="${{ github.event.inputs.target || 'https://ecommerce-backend-8ckl.onrender.com' }}"
          for i in $(seq 1 30); do
            if curl -sf "$TARGET/health" >/dev/null; then echo "backend despierto"; break; fi
            echo "esperando que el backend despierte ($i)..."; sleep 5
          done

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@master
        with:
          target: ${{ github.event.inputs.target || 'https://ecommerce-backend-8ckl.onrender.com' }}
          rules_file_name: .zap/rules.tsv
          # No falla el build por ahora (reporte informativo); cambiar a true para exigir.
          fail_action: false
          allow_issue_writing: true
          cmd_options: "-a"
