# Hooks que se ejecutan EN CADA COMMIT (local). Actívalos una vez con: pre-commit install
# (con el entorno virtual activado, para que pytest esté disponible).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff # lint (corrige lo que puede)
        args: [--fix]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black # formato

  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest (unitarias)
        entry: pytest tests/unit -q
        language: system
        pass_filenames: false
        always_run: true
