[project]
name = "ecommerce-backend"
version = "0.1.0"
description = "API REST del e-commerce de productos de belleza (MVP)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "email-validator>=2.1",
]

[project.optional-dependencies]
# Driver de PostgreSQL (runtime de desarrollo/producción). Las pruebas usan SQLite y no lo requieren.
postgres = [
    "psycopg[binary]>=3.1",
]
# Pruebas de rendimiento y estrés.
perf = [
    "locust>=2.20",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "bandit[toml]>=1.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# `Depends()` en valores por defecto es el patrón idiomático de FastAPI (no es un bug B008).
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# El gate de cobertura (--cov-fail-under=80) NO va aquí: se aplica solo en el job de integración
# de la CI (merge/producción). Así las corridas locales y de feature no fallan por cobertura.
addopts = "--cov=app --cov-report=term-missing"

[tool.bandit]
targets = ["app"]
exclude_dirs = [".venv", "tests", "migrations"]
# B104 (bind 0.0.0.0) es aceptable en contenedor; B311 no aplica (no es criptografía).
skips = ["B104", "B311"]

[tool.coverage.run]
omit = ["app/seed.py", "app/seed_products.py", "migrations/*"]
# Rutas relativas: necesario para el comentario de cobertura en el PR (py-cov-action) desde el runner.
relative_files = true
