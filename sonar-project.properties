# Identificadores del proyecto (públicos; el scanner NO expande ${VARS} aquí).
# Solo SONAR_TOKEN es secreto (va en GitHub Actions secrets).
sonar.projectKey=juandlopezm_ecommerce-backend
sonar.organization=juandlopezm
sonar.projectName=ecommerce-backend
sonar.projectVersion=1.0

# Fuentes y pruebas (unit + integration)
sonar.sources=app
sonar.tests=tests
sonar.test.inclusions=**/test_*.py

# Reportes de calidad — generados por el job "integration" del pipeline CI
# coverage.xml  →  pytest --cov-report=xml:reports/coverage.xml
# junit-all.xml →  pytest --junitxml=reports/junit-all.xml
# bandit.json   →  bandit -r app -f json -o reports/bandit.json
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.junit.reportPaths=reports/junit-unit.xml,reports/junit-integration.xml
sonar.python.bandit.reportPaths=reports/bandit.json